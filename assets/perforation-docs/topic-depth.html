</style><body><main id="topic"></main><script src="../perf-ai/engineering-real.js?v=pressure-label-fix-20261102"></script><script src="../perf-ai/topic-interactions-original.js?v=component-fix-20261102"></script><script src="../perf-ai/evaluation-real.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-real.js?v=pressure-label-fix-20261102"></script><script src="../perf-ai/topic-realistic-v3.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-overlays-v1.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-scenes-v1.js?v=evaluation-attribution-v3-20261101"></script><script>(()=>{const C={"title": "射孔目标深度校准与错层预警", "key": "depth", "question": "如何利用接箍信号与接箍记录校正射孔目标深度，并识别干扰事件？", "scope": "射孔深度校准把接箍定位信号、测井解释和作业记录放在同一测深基准下，建立工具位置与目标层段的对应关系。信号检出、接箍事件匹配和深度修正分别对应不同误差来源。校准时需要逐项检查漏检、误检和匹配歧义，避免将信号对齐直接视为目标深度已经准确。", "reading_lead": "从结构与参数出发，观察其对流动或定位结果的影响，再结合独立观测判断结论的适用范围。", "image": "depth.png", "terms": [["工程输入", "原算法使用邻域绝对幅值中位数和MAD构造局部阈值。调大κ会提高门槛，通常减少候选，也可能漏掉弱接箍。", "同时查看原信号与正负阈值，判断峰值为什么保留或排除。噪声变强后，阈值和事件检出会共同变化。"], ["计算方法", "双极脉冲可能产生多个局部峰。原程序按幅值排序，并抑制2 m内重复候选，再按深度排列。候选数与真实接箍数不能直接画等号。", "改变干扰强度，观察额外峰是否进入候选，再检查与接箍表匹配后哪些被拒绝。"], ["输出与指标", "精确率检查检出事件中有多少匹配接箍，召回率检查七个参考接箍找到多少。偏移误差则比较估计与合成已知偏移。", "高召回率可能伴随误检，偏移准确也不保证每个事件都匹配正确。应结合事件表和一对一接纳结果检查。"], ["应用条件", "现场应统一接箍表、测井与作业测深基准，保留仪器和缆伸记录，并用独立标志层核对目标位置。", "整体平移不能处理所有非线性漂移。若残差随深度呈系统变化，需要进一步检查深度伸缩或分段校准模型。"]], "scenes": [["接箍事件定位", "depth.png", "接箍表给出参考位置，信号峰值给出观测位置，平移匹配后得到校正位置。图中用不同颜色对齐三组事件，局部放大帮助辨认小于1 m的偏移。", "原算例为2000—2080 m、间隔0.05 m的合成信号，含七个接箍及两个干扰脉冲。已知偏移仅用于结果评价。"], ["目标层段深度校准", "depth.png", "原程序在±1.5 m内按0.05 m网格搜索偏移，用截断的最近距离平方和比较匹配。最优偏移用于观测深度校正。", "图中局部残差以同一零线表示，调节合成偏移时可以检查匹配能否跟随。搜索边界附近应注意最优位置是否被范围限制。"], ["现场测深基准核对", "depth.png", "现场应统一接箍表、测井与作业测深基准，保留仪器和缆伸记录，并用独立标志层核对目标位置。", "整体平移不能处理所有非线性漂移。若残差随深度呈系统变化，需要进一步检查深度伸缩或分段校准模型。"]], "bridge": "原算例为2000—2080 m、间隔0.05 m的合成信号，含七个接箍及两个干扰脉冲。已知偏移仅用于结果评价。", "intro": "接箍表给出参考位置，信号峰值给出观测位置，平移匹配后得到校正位置。图中用不同颜色对齐三组事件，局部放大帮助辨认小于1 m的偏移。", "object": "如何利用接箍信号与接箍记录校正射孔目标深度，并识别干扰事件？"},e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const geometryPlate=()=>`<div class="topic-structure-plate"><img src="${img(C.image)}" alt="井筒、套管、水泥环与砂岩的成孔剖面"><svg viewBox="0 0 1000 500" aria-hidden="true"><g stroke="#fff" stroke-width="6"><path d="M366 325H843M366 314V336M843 314V336M173 199V269M163 199H183M163 269H183"/></g><g stroke="#173e4a" stroke-width="2" fill="none"><path d="M366 325H843M366 314V336M843 314V336M173 199V269M163 199H183M163 269H183"/></g></svg>${['well','steel','cement','rock'].map((s,i)=>`<button class="part-${s}" data-component="${i}">${['井筒','套管','水泥环','储层岩石'][i]} ↗</button>`).join('')}<button class="part-D" data-term="1">入口孔径 D ↗</button><button class="part-L" data-term="0">地层穿深 L ↗</button></div>`;

const main=document.getElementById('topic'),img=name=>name.startsWith('@paper/')?'../papermap/paper-figures/'+name.slice(7):'../perforation-figures/'+name;

main.innerHTML=`<h1>${e(C.title)}的工程基础与研究问题</h1><p class="topic-lead">${e(C.reading_lead)}</p><section class="topic-section"><h2>1 ${e(C.object)}</h2><p>${e(C.intro)}</p><figure class="topic-figure"><div id="topic-anatomy"></div><figcaption>${e(C.key==='geometry'?'井筒在左，射孔依次贯穿套管、水泥环并进入右侧岩石。D标在套管开口处；L从岩石入口量到孔道末端。两者的测量位置和用途不同。图为结构示意，点击标注查看定义与设计意义。':'工具位于套管内部；接箍为套管连接部位。横向位置线、目标层段和右侧CCL信号使用共同深度参照。 图为结构示意，不按工程比例。') }</figcaption></figure><div class="topic-popup" id="topic-popup"></div></section><section class="topic-section"><h2>2 在各个工程场景中怎样使用</h2><div class="topic-tabs">${C.scenes.map((s,i)=>`<button data-scene="${i}" ${i===0?'class="active"':''}>${e(s[0])}</button>`).join('')}</div><article class="topic-scene" id="topic-scene"></article></section>`;

const sceneRelease='evaluation-attribution-v3-20261101';
function sceneAssetsReady(){return window.EngineeringOverlay?.version===sceneRelease&&typeof window.EngineeringOverlay.render==='function'&&window.EngineeringScenes?.version===sceneRelease&&typeof window.EngineeringScenes.mount==='function';}
function loadSceneScript(name,attempt){return new Promise((resolve,reject)=>{
 const script=document.createElement('script');let finished=false;
 const done=error=>{if(finished)return;finished=true;clearTimeout(timer);script.onload=script.onerror=null;script.remove();error?reject(error):resolve();};
 const timer=setTimeout(()=>done(new Error('场景脚本加载超时：'+name)),6000);
 script.src='../perf-ai/'+name+'?v='+sceneRelease+'&retry='+attempt+'-'+Date.now();script.onload=()=>done();script.onerror=()=>done(new Error('场景脚本加载失败：'+name));document.head.append(script);
});}
function ensureSceneAssets(){
 if(sceneAssetsReady())return Promise.resolve();if(sceneModules)return sceneModules;
 sceneModules=(async()=>{let error;for(let attempt=1;attempt<=3;attempt++){
  try{if(window.EngineeringOverlay?.version!==sceneRelease)await loadSceneScript('engineering-overlays-v1.js',attempt);if(window.EngineeringScenes?.version!==sceneRelease)await loadSceneScript('engineering-scenes-v1.js',attempt);if(!sceneAssetsReady())throw new Error('场景模块版本或接口不完整');return;}catch(e){error=e;}
 }throw error;})().finally(()=>{sceneModules=null;});return sceneModules;
}
async function scene(i,focus=false){
 const ticket=++sceneRequest,old=document.getElementById('topic-scene');
 main.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',+b.dataset.scene===i));
 old.querySelectorAll('.scene-load-status').forEach(x=>x.remove());
 const status=document.createElement('div');status.className='scene-load-status';status.setAttribute('role','status');status.style.cssText='padding:24px;line-height:1.8;color:#28695e';status.textContent='正在加载本场景演示…';old.prepend(status);old.setAttribute('aria-busy','true');size();
 let nextDispose=null;
 try{
  await ensureSceneAssets();if(ticket!==sceneRequest)return;
  const host=document.createElement('article');host.id='topic-scene';host.className='topic-scene';
  nextDispose=window.EngineeringScenes.mount(host,C,i);
  if(!host.querySelector('.es-stage image')||!host.querySelector('.es-overlay>g'))throw new Error('场景挂载不完整');
  // Keep the previous working canvas alive until its replacement is complete.
  disposeScene();old.replaceWith(host);disposeScene=nextDispose;nextDispose=null;size();

 }catch(error){

 }
}

main.addEventListener('click',ev=>{const part=ev.target.closest('[data-component]');if(part)parent.postMessage({type:'petro-topic-component',key:C.key,index:+part.dataset.component},'*');const t=ev.target.closest('[data-term]');if(t){parent.postMessage({type:'petro-topic-term',key:C.key,index:+t.dataset.term},'*')}if(ev.target.closest('[data-close]')){document.getElementById('topic-popup').classList.remove('open');size()}const b=ev.target.closest('[data-scene]');if(b)scene(+b.dataset.scene,true)});

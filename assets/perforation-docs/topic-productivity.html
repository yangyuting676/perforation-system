</style><body><main id="topic"></main><script src="../perf-ai/engineering-real.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/topic-interactions-original.js?v=component-fix-20261102"></script><script src="../perf-ai/evaluation-real.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-real.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/topic-realistic-v3.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-overlays-v1.js?v=evaluation-attribution-v3-20261101"></script><script src="../perf-ai/engineering-scenes-v1.js?v=evaluation-attribution-v3-20261101"></script><script>(()=>{const C={"title": "射孔后产能潜力预测", "key": "productivity", "question": "在给定储层和流体条件下，射孔附加阻力会怎样影响产量与产能指数？", "scope": "射孔完井产能由储层供流能力、近井与孔道阻力、流体性质以及生产压差共同决定。比较不同完井方案时，应先明确流动假设，并保持压力和流体条件可比。这样才能区分增加压差带来的产量变化，与降低完井阻力带来的产能变化。", "reading_lead": "从结构与参数出发，观察其对流动或定位结果的影响，再结合独立观测判断结论的适用范围。", "image": "productivity.png", "terms": [["工程输入", "渗透率k和厚度h共同影响供液能力，黏度μ影响流动阻力，附加表皮s描述近井额外阻力。固定其他参数，先增加s，再比较Q和J。", "随后只增大压差。若Q上升而J保持不变，说明改变的是驱动力，不是该模型中的储层—完井流动能力。"], ["计算方法", "原程序用60个带扰动样本拟合表皮响应函数g(s)，采用三次多项式和岭项求系数。产量再由储层与流体因子、压差和这个函数组合得到。", "打开多项式贡献与系数，区分回归近似误差和径向流动关系。页面调整储层输入时，使用原有代理系数，不重新制造训练结果。"], ["输出与指标", "原程序以40个无噪中点检验代理函数，再将误差传播到当前产量尺度。参考—预测图越接近一致线，说明这组函数近似误差越小。", "该误差没有包括真实地层非均质、多相流或试井解释误差。读者应分别核对函数拟合和流动假设。"], ["应用条件", "实际研究需整理稳定生产与试井资料、有效厚度、渗透率、黏度和体积系数，并说明表皮来源。设计变更后还要用独立生产数据核验。", "多相、非达西或瞬态工况应采用相应模型。保留本案例的单相范围，能够让参数作用和验证对象清楚对应。"]], "scenes": [["稳定单相产能计算", "productivity.png", "横轴为生产压差，纵轴为日产量。当前曲线和进入页面时的虚线共用坐标，标记点表示当前压差下的计算产量。左侧参数和右侧结果一起比较。", "原模型采用稳态单相径向流动及既定几何、体积系数。此时Q随压差呈线性，产能指数J=Q/Δp。"], ["附加表皮与产能变化", "damage.png", "先保存基准，只调整附加表皮，观察流入曲线斜率及产能指数。再单独调整黏度，判断两种变化是否都使曲线斜率降低。", "每次比较保留k、h、μ、s与Δp。只有条件一致，才能把某项产量变化与所改参数联系起来。"], ["实际生产资料核对", "engineering-flow.png", "实际研究需整理稳定生产与试井资料、有效厚度、渗透率、黏度和体积系数，并说明表皮来源。设计变更后还要用独立生产数据核验。", "多相、非达西或瞬态工况应采用相应模型。保留本案例的单相范围，能够让参数作用和验证对象清楚对应。"]], "bridge": "原模型采用稳态单相径向流动及既定几何、体积系数。此时Q随压差呈线性，产能指数J=Q/Δp。", "intro": "横轴为生产压差，纵轴为日产量。当前曲线和进入页面时的虚线共用坐标，标记点表示当前压差下的计算产量。左侧参数和右侧结果一起比较。", "object": "在给定储层和流体条件下，射孔附加阻力会怎样影响产量与产能指数？"},e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const geometryPlate=()=>`<div class="topic-structure-plate"><img src="${img(C.image)}" alt="井筒、套管、水泥环与砂岩的成孔剖面"><svg viewBox="0 0 1000 500" aria-hidden="true"><g stroke="#fff" stroke-width="6"><path d="M366 325H843M366 314V336M843 314V336M173 199V269M163 199H183M163 269H183"/></g><g stroke="#173e4a" stroke-width="2" fill="none"><path d="M366 325H843M366 314V336M843 314V336M173 199V269M163 199H183M163 269H183"/></g></svg>${['well','steel','cement','rock'].map((s,i)=>`<button class="part-${s}" data-component="${i}">${['井筒','套管','水泥环','储层岩石'][i]} ↗</button>`).join('')}<button class="part-D" data-term="1">入口孔径 D ↗</button><button class="part-L" data-term="0">地层穿深 L ↗</button></div>`;
const interaction=window.TopicInteraction(C);let disposeScene=()=>{};
const main=document.getElementById('topic'),img=name=>name.startsWith('@paper/')?'../papermap/paper-figures/'+name.slice(7):'../perforation-figures/'+name;
C.intro='储层流体在压差驱动下进入井筒。提高井底压力会减小驱动压差，增大近井阻力则使流入更困难；两种原因应分别判断，再到案例演示核对定量结果。';
main.innerHTML=`<h1>${e(C.title)}的工程基础与研究问题</h1><p class="topic-lead">${e(C.reading_lead)}</p><section class="topic-section"><h2>1 ${e(C.object)}</h2><p>${e(C.intro)}</p><figure class="topic-figure"><div id="topic-anatomy"></div><figcaption>${e(C.key==='geometry'?'井筒在左，射孔依次贯穿套管、水泥环并进入右侧岩石。D标在套管开口处；L从岩石入口量到孔道末端。两者的测量位置和用途不同。图为结构示意，点击标注查看定义与设计意义。':'储层、近井扰动区与套管井筒剖面。流线表示向井筒流入，压力标尺和近井区标记随控件变化。 图为结构示意，不按工程比例。') }</figcaption></figure><div class="topic-popup" id="topic-popup"></div></section><section class="topic-section"><h2>2 在各个工程场景中怎样使用</h2><div class="topic-tabs">${C.scenes.map((s,i)=>`<button data-scene="${i}" ${i===0?'class="active"':''}>${e(s[0])}</button>`).join('')}</div><article class="topic-scene" id="topic-scene"></article></section>`;
interaction.mount(document.getElementById('topic-anatomy'),0,true);
let sceneRequest=0,sceneModules=null;
const sceneRelease='evaluation-attribution-v3-20261101';
function sceneAssetsReady(){return window.EngineeringOverlay?.version===sceneRelease&&typeof window.EngineeringOverlay.render==='function'&&window.EngineeringScenes?.version===sceneRelease&&typeof window.EngineeringScenes.mount==='function';}
function loadSceneScript(name,attempt){return new Promise((resolve,reject)=>{
 const script=document.createElement('script');let finished=false;
 const done=error=>{if(finished)return;finished=true;clearTimeout(timer);script.onload=script.onerror=null;script.remove();error?reject(error):resolve();};
 const timer=setTimeout(()=>done(new Error('场景脚本加载超时：'+name)),6000);
 script.src='../perf-ai/'+name+'?v='+sceneRelease+'&retry='+attempt+'-'+Date.now();script.onload=()=>done();script.onerror=()=>done(new Error('场景脚本加载失败：'+name));document.head.append(script);
});}
function ensureSceneAssets(){
 if(sceneAssetsReady())return Promise.resolve();if(sceneModules)return sceneModules;
 sceneModules=(async()=>{let error;for(let attempt=1;attempt<=3;attempt++){
  try{if(window.EngineeringOverlay?.version!==sceneRelease)await loadSceneScript('engineering-overlays-v1.js',attempt);if(window.EngineeringScenes?.version!==sceneRelease)await loadSceneScript('engineering-scenes-v1.js',attempt);if(!sceneAssetsReady())throw new Error('场景模块版本或接口不完整');return;}catch(e){error=e;}
 }throw error;})().finally(()=>{sceneModules=null;});return sceneModules;
}
async function scene(i,focus=false){
 const ticket=++sceneRequest,old=document.getElementById('topic-scene');
 main.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',+b.dataset.scene===i));
 old.querySelectorAll('.scene-load-status').forEach(x=>x.remove());
 const status=document.createElement('div');status.className='scene-load-status';status.setAttribute('role','status');status.style.cssText='padding:24px;line-height:1.8;color:#28695e';status.textContent='正在加载本场景演示…';old.prepend(status);old.setAttribute('aria-busy','true');size();
 let nextDispose=null;
 try{
  await ensureSceneAssets();if(ticket!==sceneRequest)return;
  const host=document.createElement('article');host.id='topic-scene';host.className='topic-scene';
  nextDispose=window.EngineeringScenes.mount(host,C,i);
  if(!host.querySelector('.es-stage image')||!host.querySelector('.es-overlay>g'))throw new Error('场景挂载不完整');
  // Keep the previous working canvas alive until its replacement is complete.
  disposeScene();old.replaceWith(host);disposeScene=nextDispose;nextDispose=null;size();
  if(focus)requestAnimationFrame(()=>{if(ticket===sceneRequest)parent.postMessage({type:'petro-topic-focus',y:host.getBoundingClientRect().top},'*');});
 }catch(error){
  if(nextDispose)nextDispose();if(ticket!==sceneRequest)return;
  old.removeAttribute('aria-busy');status.textContent='演示暂未加载完成。';const retry=document.createElement('button');retry.type='button';retry.textContent='重新加载本场景';retry.onclick=()=>scene(i,focus);status.append(' ',retry);console.error('场景加载失败',C.key,i,error);size();
 }
}

main.addEventListener('click',ev=>{const part=ev.target.closest('[data-component]');if(part)parent.postMessage({type:'petro-topic-component',key:C.key,index:+part.dataset.component},'*');const t=ev.target.closest('[data-term]');if(t){parent.postMessage({type:'petro-topic-term',key:C.key,index:+t.dataset.term},'*')}if(ev.target.closest('[data-close]')){document.getElementById('topic-popup').classList.remove('open');size()}const b=ev.target.closest('[data-scene]');if(b)scene(+b.dataset.scene,true)});
function size(){requestAnimationFrame(()=>parent.postMessage({type:'petro-lite-height',height:Math.ceil(main.getBoundingClientRect().height)},'*'))}new ResizeObserver(size).observe(main);document.querySelectorAll('img').forEach(i=>i.addEventListener('load',size));window.addEventListener('resize',size);scene(0);size();})();

05", "A06"], "figs": ["volve-eda", "volve-lgb", "volve-window", "volve-result"], "figures": [{"file": "volve-eda.png", "caption": "Alaghbari作者仓库，EDA笔记本：F-14生产轨迹", "url": "https://github.com/ashrafalaghbari/GA-TCN-LSTM/blob/main/data_preprocessing/eda.ipynb", "note": "直接提取仓库已保存的图形输出。油量已按作者代码转换为bbl；原图的时间划分与本站新模型划分不同。", "kind": "作者仓库笔记本原输出"}, {"file": "volve-lgb.png", "caption": "Cheng等（2026），图5：LightGBM提升机制", "url": "https://doi.org/10.3390/s26113332", "note": "原文将LightGBM用于TCN残差修正。本例独立使用LightGBM预测滞后产量的增量，不能称为完整TAR-Net复现。", "source_file": "volve2026.pdf", "page": 9, "crop": [78.15900421142578, 352.1180419921875, 520.47900390625, 580.5980224609375], "kind": "原文图/表的原位裁切，未重绘"}, {"file": "volve-window.png", "caption": "Cheng等（2026），图8：时序滑窗", "url": "https://doi.org/10.3390/s26113332", "note": "历史窗口先于预测时刻，划分与指标对应明确时间段。图中论文流程与本站70/15/15划分需要分别阅读。", "source_file": "volve2026.pdf", "page": 14, "crop": [163.0, 65.0, 515.0, 255.0], "kind": "原文图/表的原位裁切，未重绘"}, {"file": "volve-result.png", "caption": "Cheng等（2026），图15：原文模型轨迹对照", "url": "https://doi.org/10.3390/s26113332", "note": "原图是论文各模型的预测轨迹，不是本站运行结果。本次误差、持续性基线和测试日期单独计算并常显。", "source_file": "volve2026.pdf", "page": 22, "crop": [38.07899856567383, 212.16802978515625, 561.3989868164062, 488.468017578125], "kind": "原文图/表的原位裁切，未重绘"}], "paper": {"title": "TAR-Net论文中的残差学习：预测与措施评价的距离", "citation": "Cheng et al. (2026). A Sensor-Aware Decoupled Learning Framework for Robust Multi-Scale Time-Series Forecasting in Oil Production Systems. Sensors 26, 3332. DOI:10.3390/s26113332.", "url": "https://doi.org/10.3390/s26113332", "chapters": [{"title": "问题：生产量同时具有时间依赖与状态关联", "anchor": "原文第2节，图1，p.5", "paragraphs": ["论文同时研究生产序列的时间依赖和多变量非线性关联。油量及其变化的相空间结构展示了动态轨迹，为时序建模提供依据；措施的净增产则需要额外的干预证据。", "原文使用Volve资料研究预测方法。本案例采用公开F-14日生产子集，尚未完成射孔、完井与生产记录的干预配对，因此分别报告生产预测误差与效果归因的证据边界。"], "fig": "read-volve-space", "formula": null, "symbols": "", "table": null}, {"title": "方法：先拟合主趋势，再学习剩余误差", "anchor": "原文第3节，图3、5，pp.7–10", "paragraphs": ["TAR-Net先以TCN学习时序主趋势，再用L row.innerHTML=`<div class="ai-training-settings"><strong>从头训练</strong>${C.key==='damage'?'<label>核长度 <input id="train-length" type="number" min="0.1" max="3" step="0.05" value="0.65"></label><label>噪声参数 <input id="train-noise" type="number" min="0.001" max="0.5" step="0.01" value="0.04"></label>':`<label>${['geometry','evaluation'].includes(C.key)?'树数':'轮数'} <input id="train-rounds" type="number" min="1" max="${C.key==='network'?3000:300}" value="${defaults[0]}"></label><label>学习率 <input id="train-rate" type="number" min="0.00001" max="0.3" step="0.001" value="${defaults[1]}"></label>`}<label>种子 <input id="train-seed" type="number" min="0" max="999999" value="334"></label><button id="train-start">开始训练</button><button id="train-stop" disabled>停止</button><button id="train-download" hidden>保存新模型</button></div><div class="ai-training-progress"><progress id="train-progress" max="1" value="0"></progress><span id="train-state" role="status">正在连接训练服务…</span><svg id="train-spark" viewBox="0 0 180 35" aria-label="本次训练损失曲线"></svg></div><p id="train-result">当前展示随包预训练模型；开始训练后重新初始化参数，完成后替换本页权重与测试结果。</p>`;
document.querySelector('.ai-head').after(row);
function send(action,extra={}){parent.postMessage({type:'perf-ai-train',case:C.id,key:C.key,action,...extra},'*')}
function state(s){$('train-state').textContent=s;}
function busy(on){trainingBusy=on;$('train-start').disabled=on;$('train-stop').disabled=!on;document.querySelectorAll('.ai-training-settings input').forEach(x=>x.disabled=on)}
function draw(){if(history.length<2)return;const v=history.filter(h=>Number.isFinite(h.loss)).map(h=>h.loss);if(v.length<2)return;const lo=Math.min(...v),hi=Math.max(...v);$('train-spark').innerHTML='<polyline fill="none" stroke="#247b69" stroke-width="2" points="'+v.map((y,i)=>(3+i*174/(v.length-1))+','+(31-(y-lo)/(hi-lo||1)*27)).join(' ')+'"/>';}
$('train-start').onclick=()=>{active=null;history=[];$('train-spark').innerHTML='';$('train-progress').value=0;$('train-result').textContent='正在启动训练任务；仅加载当前算法所需依赖。数据划分保持，测试集不参与梯度更新。';busy(true);$('train-stop').disabled=true;state('启动中…');send('start',{settings:C.key==='damage'?{length:+$('train-length').value,noise:+$('train-noise').value,seed:+$('train-seed').value}:{rounds:+$('train-rounds').value,lr:+$('train-rate').value,seed:+$('train-seed').value}})};
$('train-stop').onclick=()=>send('cancel',{job:active});
$('train-download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(M)],{type:'application/json'}));a.download=C.key+'-trained-model.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.addEventListener('message',e=>{
if(e.source!==parent||e.data?.type!=='perf-ai-train-state'||e.data.case!==C.id)return;
const d=e.data;
if(d.health){if(trainingBusy)return;$('train-start').disabled=!d.health.available;state(d.health.available?'训练服务已就绪 · 使用本机CPU':d.health.missing?.length?'缺少依赖：'+d.health.missing.join(','):'当前是静态预览，请用随包启动器开启训练服务');return}
if(d.error){busy(false);state(d.error);return}
if(Number.isFinite(d.elapsed))elapsed=d.elapsed;active=d.id||active;if(d.id&&['starting','training'].includes(d.state))busy(true);if(d.history){history=d.history;const h=history.at(-1);if(h){$('train-progress').max=h.total;$('train-progress').value=h.step;state('实际完成 '+h.step+' / '+h.total+(h.loss!==null?' · 训练损失 '+Number(h.loss).toPrecision(4):'')+(h.validation!==null?' · 验证 '+Number(h.validation).toPrecision(4):''));draw()}}
if(d.state==='starting')state((d.message||'正在启动训练进程')+' · 已用时 '+elapsed+' 秒');
if(d.phase==='exporting'||d.state==='completed')state('训练已结束，正在载入新权重与验证结果 · 已用时 '+elapsed+' 秒');
if(d.state==='cancelled'){busy(false);state('已停止 · 保留停止前模型');}
if(d.model){Object.assign(M,d.model);trained=true;busy(false);$('train-progress').value=$('train-progress').max;state('训练完成 · 已载入本次新权重 · 用时 '+elapsed+' 秒');$('train-download').hidden=false;$('train-result').textContent='任务 '+active.slice(0,8)+' · 随机种子 '+M.seed+'；下方图、预测和测试成绩已切换到本次模型。刷新页面恢复随包模型。';window.dispatchEvent(new CustomEvent('perf-model-replaced'));}
});send('health');
})();
</script><script src="../petro94/legacy-loader.js?v=86d998623d0d"></script></body></html>

-shap", "xgb-fig1", "G05-validation", "G03-model"], "figures": [{"file": "G05-shap.png", "caption": "Nashed等（2026）原文图8", "url": "https://doi.org/10.3390/fluids11030064", "note": "保留修正版已有原文图。属于论文结果或结构，不能作为本站新模型的训练成绩。", "kind": "修正版已有原图，逐字节复制"}, {"file": "xgb-fig1.png", "caption": "Chen与Guestrin（2016），图1：树集成加和", "url": "https://arxiv.org/pdf/1603.02754", "note": "每棵树将输入送入一个叶节点，最终预测为叶分数之和加初始值。原图示例对象与本站穿深数据不同，结构原理相同。", "source_file": "xgboost.pdf", "page": 2, "crop": [315.0, 40.0, 560.0, 150.0], "kind": "原文图/表的原位裁切，未重绘"}, {"file": "G05-validation.png", "caption": "Nashed等（2026）原文图9", "url": "https://doi.org/10.3390/fluids11030064", "note": "保留修正版已有原文图。属于论文结果或结构，不能作为本站新模型的训练成绩。", "kind": "修正版已有原图，逐字节复制"}, {"file": "G03-model.png", "caption": "Liang等（2024）原文图3", "url": "https://doi.org/10.3390/pr12071308", "note": "保留修正版已有原文图。属于论文结果或结构，不能作为本站新模型的训练成绩。", "kind": "修正版已有原图，逐字节复制"}], "paper": {"title": "从API 19B试验预测穿深：怎样判断模型可信？", "citation": "Nashed et al. (2026). From Laboratory Measurements to AI-Driven Insights: Predicting Shaped Charge Performance with Advanced Machine Learning. Fluids 11, 64.", "url": "https://doi.org/10.3390/fluids11030064", "chapters": [{"title": "问题与资料：预测的是试验穿深", "anchor": "原文第2节，表1、3，pp.6–8、14", "paragraphs": ["研究将聚能射孔弹的试验穿深预测表述为回归任务。1648组API 19B标准化测试中，1318组用于训练和超参数选择，330组用于盲测。预测目标限于试验定义的穿深，尚未覆盖完整孔道形态或井下有效连通长度。", "输入包含装药、枪体、套管和靶体条件。比较模型前，应核对变量范围、受压条件及穿深的起算位置。本案例未取得原文1648条原始记录，采用已标明来源的模拟表演示训练，其成绩需单独解释。"], "fig": null, "formula": null, "symbols": "", "table": {"caption": "原文与本案例的数据及评价条件", "heads": ["项目", "论文", "当前演示"], "rows": [["数据", "1648组API 19B测试", "1400条生成式模拟"], ["训练/留出", "1318 / 330", "1120 / 280"], ["预测目标", "试验穿深，in", "模拟穿深，in"], ["性能含义", "论文测试范围内的预测", "近似模拟生成关系"]]}}, {"title": "方法：XGBoost怎样逐步修正回归误差", "anchor": "原文第2.4节；Chen & Guestrin (2016) §2", "paragraphs": ["XGBoost逐步在当前预测上增加回归树，用新树修正目标函数中的剩余误差。正则项约束模型复杂度，学习率控制每一步修正的幅度，共同影响拟合速度与泛化表现。", "特征重要性反映模型在训练中利用变量的方式，其物理含义仍需结合试验设计判断。例如装药量与器材系列相关时，较高重要性可能同时包含机制作用和样本分布的影响。"], "fig": "read-xgb-system", (()=>{

});send('health');

-tcn", "volve-window", "volve-result"], "figures": [{"file": "volve-eda.png", "caption": "Alaghbari作者仓库，EDA笔记本：F-14生产轨迹", "url": "https://github.com/ashrafalaghbari/GA-TCN-LSTM/blob/main/data_preprocessing/eda.ipynb", "note": "直接提取仓库已保存的图形输出。油量已按作者代码转换为bbl；原图的时间划分与本站新模型划分不同。", "kind": "作者仓库笔记本原输出"}, {"file": "volve-tcn.png", "caption": "Cheng等（2026），图4：多尺度空洞TCN主干", "url": "https://doi.org/10.3390/s26113332", "note": "从历史输入、空洞卷积到输出理解信息流。本文采用小型TCN，不包含原文全部多尺度特征或超参数优化流程。", "source_file": "volve2026.pdf", "page": 8, "crop": [40.720001220703125, 61.37200927734375, 550.719970703125, 353.6920166015625], "kind": "原文图/表的原位裁切，未重绘"}, {"file": "volve-window.png", "caption": "Cheng等（2026），图8：时序滑窗", "url": "https://doi.org/10.3390/s26113332", "note": "历史窗口先于预测时刻，划分与指标对应明确时间段。图中论文流程与本站70/15/15划分需要分别阅读。", "source_file": "volve2026.pdf", "page": 14, "crop": [163.0, 65.0, 515.0, 255.0], "kind": "原文图/表的原位裁切，未重绘"}, {"file": "volve-result.png", "caption": "Cheng等（2026），图15：原文模型轨迹对照", "url": "https://doi.org/10.3390/s26113332", "note": "原图是论文各模型的预测轨迹，不是本站运行结果。本次误差、持续性基线和测试日期单独计算并常显。", "source_file": "volve2026.pdf", "page": 22, "crop": [38.07899856567383, 212.16802978515625, 561.3989868164062, 488.468017578125], "kind": "原文图/表的原位裁切，未重绘"}], "paper": {"title": "时间卷积预测生产：从因果感受野到独立测试", "citation": "Cheng et al. (2026), Sensors 26, 3332；方法补充：Bai, Kolter & Koltun (2018), arXiv:1803.01271.", "url": "https://doi.org/10.3390/s26113332", "chapters": [{"title": "问题：只知道过去时，能预测多远？", "anchor": "Cheng等第2—3节；Bai等§3", "paragraphs": ["生产预测首先受可用信息的时间范围约束。TCN以因果卷积限制未来信息，并用空洞卷积扩大历史感受野。较长历史有助于描述时间关联，停产与制度变化仍可能引起较大误差。", "原文TAR-Net组合TCN与残差模型，架构图展示了预处理、主干和残差模块的联系。本案例仅采用小型TCN，结果按这一具体实现评价。"], "fig": "read-volve-architecture", "formula": null, "symbols": "", "table": null}, {"title": "方法：空洞卷积扩大历史覆盖，而不是偷看未来", "anchor": "Bai等§3.1，图1；Cheng等第3节", "paragraphs": ["空洞率d规定卷积采样点之间的间隔。下式采用t−dr，使输出依赖当前及过去的信息；多层叠加进一步扩大可用历史范围。", "单步预测与多步递推对应不同的信息条件。递推将前一步预测写入后续输入，误差随之传播。若后续窗口使用未来实测值，评价任务也相应改变，需要单独报告。"], "fig": null, "formula": "

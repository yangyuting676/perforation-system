function execute(){completed.add(step);if(flowPanel)$('#execute').textContent='✓ 本步已完成';let out=['已载入17条记录、13种参数组合。原始CSV和论文来源已保留。','核对完成：缺失值0；中心配置5条；负响应2条。全部原值保留，编码与表2对应。','已整理物理条件、耦合方法和Box–Behnken设计；后续使用论文公开的17条数值响应。','已计算当前模型对17条表3记录的拟合指标与残差。','已记录 A='+chosen.A+'，B='+chosen.B+'，C='+chosen.C+' mm；预测 ΔL='+fmt(predict(chosen.A,chosen.B,chosen.C))+' m。','候选表已生成。点击“带入验证”选定配置，也可保留当前参数进入下一步。','已记录当前候选的对照状态；无表5对照的配置列入数值复核。','方案记录已整理，可下载参数、模型、约束、来源和下一阶段工作。'][step];if(step===5)search();$('#step-result').innerHTML='<h3>本步输出</h3><p>'+out+'</p>';$('#step-result').hidden=false;drawArchitecture();queueHeight();}
function download(){let data={doi:DATA.doi,source:DATA.source_table,model,parameters:chosen,predicted_signed_delta_m:predict(chosen.A,chosen.B,chosen.C),predicted_abs_delta_m:Math.abs(predict(chosen.A,chosen.B,chosen.C)),research_objective:window.PetroOptimization?.exportState(),constraints:{max_total_holes:budget,max_middle_diameter_mm:diameterLimit,convex_hull:true},fixed_conditions:DATA.fixed_conditions,completed_steps:[...completed].map(i=>tasks[i][0]),next_stage:planTarget,next_tasks:plans[planTarget],record_kind:'research design and validation plan',exported_at:new Date().toISOString()};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='perforation-research-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){step=+b.dataset.step;if(flowPanel)render()}else if(b.id==='previous'||b.id==='next'){step+=b.id==='next'?1:-1;render()}else if(b.id==='execute')execute();else if(b.dataset.explain!==undefined)physics(+b.dataset.explain);else if(b.dataset.candidate!==undefined){let r=candidates[+b.dataset.candidate];chosen={A:r.A,B:r.B,C:r.C};lastCandidate={...chosen};step=6;render()}else if(b.dataset.reference!==undefined){let v=DATA.verification[+b.dataset.reference];chosen={A:v.middle_holes,B:v.side_holes,C:v.middle_diameter_mm};verify()}else if(b.hasAttribute('data-current')){if(lastCandidate)chosen={...lastCandidate};verify()}else if(b.id==='download')download();else if(b.id==='feedback'){step=0;render()}});
document.addEventListener('change',e=>{if(e.target.id==='record'){record=+e.target.value;preview()}if(e.target.id==='model'){model=e.target.value;if(step===3)fitView();if(step===4)live();if(step===5){candidates=[];$('#candidate-view').innerHTML='<p>模型已更改，请重新执行整数优选。</p>';}if(step===6)verify()}if(e.target.id==='budget'||e.target.id==='diameter'){budget=+$('#budget').value;diameterLimit=+$('#diameter').value;$('#candidate-view').innerHTML='<p>约束已更改，请重新执行整数优选。</p>';}if(e.target.id==='plan-target'){planTarget=e.target.value;plan()}queueHeight()});
document.addEventListener('input',e=>{if(e.target.dataset.param){chosen[e.target.dataset.param]=+e.target.value;completed.delete(4);$('#execute').textContent=tasks[4][4];$('#step-result').hidden=true;drawArchitecture();live()}});
let heightFrame;function queueHeight(){cancelAnimationFrame(heightFrame);heightFrame=requestAnimationFrame(()=>parent.postMessage({type:'petro-lite-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)+8},'*'))}
const flowPanel=new URLSearchParams(location.search).get('panel')==='1';
function flowState(){return {step,model,chosen,lastCandidate,budget,diameterLimit,record,completed:[...completed],planTarget}}
function restoreFlow(s){if(!s)return;model=s.model==='refit'?'refit':'paper';if(s.chosen)chosen=s.chosen;lastCandidate=s.lastCandidate||null;budget=s.budget||60;diameterLimit=s.diameterLimit||18;record=s.record||0;completed=new Set(s.completed||[]);planTarget=s.planTarget||'numerical'}
if(flowPanel){document.documentElement.classList.add('panel-mode');step=Math.max(0,Math.min(7,+new URLSearchParams(location.search).get('step')||0));const toolbar=document.createElement('div');toolbar.className='panel-toolbar';toolbar.innerHTML='<span>研究流程 · 操作与讲解</span><button id="panel-close">返回架构图 ×</button>';document.querySelector('.step-panel').prepend(toolbar);const io=document.getElementById('io-strip'),ioDetails=document.createElement('details'),ioSummary=document.createElement('summary');ioDetails.className='flow-io';ioSummary.textContent='本步的输入 → 处理 → 输出';io.before(ioDetails);ioDetails.append(ioSummary,io);document.getElementById('panel-close').onclick=()=>parent.postMessage({type:'petro-lite-close-panel',state:flowState()},'*');window.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'petro-lite-close-panel',state:flowState()},'*')});}
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='petro-lite-request-close'&&flowPanel){parent.postMessage({type:'petro-lite-close-panel',state:flowState()},'*');return}if(e.data?.type==='petro-lite-panel-init'){restoreFlow(e.data.state);step=Number(e.data.step)||0;render()}if(e.data?.type==='petro-lite-panel-return'){restoreFlow(e.data.state);drawArchitecture()}});
new ResizeObserver(queueHeight).observe(document.querySelector('main'));window.addEventListener('load',queueHeight);render();


function arrangeFlow(){const w=document.getElementById('step-workspace');w.dataset.stageStep=step;
 if(step===1){let variables=w.querySelector('.variables'),formula=w.querySelector('.formula'),tabbar=document.createElement('div'),definition=document.createElement('div'),coding=document.createElement('div');tabbar.className='flow-sheets';tabbar.innerHTML='<button data-sheet="definition" class="active">参数具体含义</button><button data-sheet="coding">原始记录与编码</button>';definition.dataset.sheetPanel='definition';coding.dataset.sheetPanel='coding';definition.append(variables);[...w.children].forEach(n=>coding.append(n));coding.hidden=true;w.append(tabbar,definition,coding);}
 if(step===5){let grid=w.querySelector('.workspace-grid'),box=document.createElement('div'),label=w.querySelector('label'),select=w.querySelector('#model');box.append(label,select);grid.prepend(box);grid.classList.add('three-choices');}
 if(step===7){let grid=document.createElement('div'),left=document.createElement('div'),right=document.createElement('div');grid.className='workspace-grid';let detail=document.getElementById('plan-detail');[...w.children].forEach(n=>(n===detail?right:left).append(n));grid.append(left,right);w.append(grid);}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sheet]');if(!b?.dataset.sheet)return;document.querySelectorAll('[data-sheet-panel]').forEach(p=>p.hidden=p.dataset.sheetPanel!==b.dataset.sheet);document.querySelectorAll('[data-sheet]').forEach(x=>x.classList.toggle('active',x===b))});

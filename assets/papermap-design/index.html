function section(title,text){return '<section class="reading-section"><h3>'+title+'</h3><p>'+esc(text)+'</p></section>'}
function paperButton(id){let p=PAPERS.find(p=>p.id===id);return '<button onclick="openPaper(\''+id+'\')">['+p.refNumber+'] '+esc(p.author)+' · '+p.year+'</button>'}
function focusDetail(){requestAnimationFrame(()=>requestAnimationFrame(()=>parent.postMessage({type:'petro-papermap-focus',y:document.getElementById('paper-detail').offsetTop},'*')))}
function originalFigures(p){
 const figures=p.figures||[];
 if(!figures.length)return '<div class="figure-source-link"><strong>原文图版</strong><p>当前资料未收录可核对的原文图版，可前往出版商页面查看。</p><a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">前往出版商查看图版 ↗</a></div>';
 return '<section class="original-figures"><h3>来源配图与读图说明</h3>'+figures.map(f=>{let file=f.file||(p.id+'-fig'+f.number+'.png'),label=f.label||('原文图 '+f.number);return '<figure><a href="../papermap/paper-figures/'+esc(file)+'" target="_blank" rel="noopener" aria-label="打开'+esc(label)+'大图"><img loading="lazy" width="'+f.width+'" height="'+f.height+'" style="width:'+f.width+'px;aspect-ratio:'+f.width+'/'+f.height+'" src="../papermap/paper-figures/'+esc(file)+'" alt="'+esc(label)+'：'+esc(f.explanation)+'"></a><figcaption><strong>'+esc(label)+'</strong><p>'+esc(f.explanation)+'</p><small>'+esc(p.author)+' ('+p.year+') · <a href="'+esc(f.url)+'" target="_blank" rel="noopener">原图来源 ↗</a> · <a href="'+esc(p.doi?'https://doi.org/'+p.doi:p.source_url)+'" target="_blank" rel="noopener">原文与图注 ↗</a> · 点击图片查看原尺寸</small></figcaption></figure>'}).join('')+'</section>'
}
function showPaperDetail(p){if(!p)return;selected=p.id;if(demoPapers.some(x=>x.id===p.id))highlightNeighborhood(p.id);document.querySelectorAll('[data-gap]').forEach(b=>b.classList.toggle('active',b.dataset.gap===p.id));const box=document.getElementById('paper-detail');box.hidden=false;
 let head='<div class="detail-heading"><div><small>'+(p.isGap?'研究缺口':'文献 ['+p.refNumber+'] · '+esc(p.author)+' · '+p.year)+'</small><h2>'+esc(p.title)+'</h2></div><button onclick="closePaperDetail()">收起</button></div>';
 if(p.isGap){box.innerHTML=head+'<figure class="question-figure"><img src="../perforation-gaps/'+esc(p.image)+'" alt="'+esc(p.title+'：验证思路概念图')+'" decoding="async"><figcaption>'+esc(p.image_caption)+'<small>验证思路概念图，非实测图像或已验证结果。</small></figcaption></figure><div class="status-pill">'+esc(p.status)+'</div>'+section('缺口依据',p.question)+section('验证路径',p.method)+section('尚缺的证据',p.remaining)+'<div class="related-links">'+p.related.map(paperButton).join('')+'</div>'}
 else{let related=ALL_EDGES.filter(e=>e.kind!=='question'&&(e.from===p.id||e.to===p.id));let later=related.filter(e=>['revision','extension'].includes(e.kind)&&e.from===p.id&&PAPERS.find(q=>q.id===e.to)?.year>=p.year);let image=SCENES[p.category].image;
 box.innerHTML=head+'<p class="reference-title">'+esc(p.referenceTitle)+'</p><div class="reading-meta"><span>'+esc(categoryLabel(p.category))+'</span>'+(p.source_type?'<span>'+esc(p.source_type)+'</span>':'')+'<span>阅读范围：'+esc(p.access)+'</span></div>'+section('研究问题',p.question)+(p.sections||[]).map(([title,text])=>section(title,text)).join('')+originalFigures(p)+section('研究方法',p.method)+section('主要结果',p.result)+section('研究贡献',p.contribution)+section('适用条件与局限',p.limitations)+'<h3>后续进展</h3>'+(later.length?later.map(e=>'<div class="relation-reading">'+paperButton(e.to)+'<p>'+esc(e.reason)+'</p></div>').join(''):'<p>所选文献尚未提供直接检验这一局限的后续证据。</p>')+'<h3>相关文献与关系依据</h3>'+related.map(e=>'<div class="relation-reading">'+paperButton(e.from===p.id?e.to:e.from)+'<p>'+esc(EDGE_STYLES[e.kind].label)+'：'+esc(e.reason)+'</p></div>').join('')+'<details class="source-record"><summary>文献与来源位置</summary><p>'+esc(p.citation)+'</p><p>阅读位置：'+esc(p.anchor)+'</p><p>“适用条件与局限”包含基于研究设计作出的评估；后续补充按上述关系逐项说明。</p></details><p><a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">原始文献 ↗</a>　<a href="'+esc(p.doi?'https://doi.org/'+p.doi:p.source_url)+'" target="_blank" rel="noopener">文献 ↗</a></p>'}
 focusDetail();queueHeight()}
function openPaper(id){showPaperDetail([...PAPERS,...QUESTIONS].find(p=>p.id===id))}
function closePaperDetail(){document.getElementById('paper-detail').hidden=true;clearHighlight();selected=null;queueHeight()}
function renderPaperList(){document.getElementById('graph-container').innerHTML='<div class="paper-list">'+demoPapers.map(p=>'<button class="paper-card" onclick="openPaper(\''+p.id+'\')"><span class="paper-rank">'+(p.isGap?'?':'['+p.refNumber+']')+'</span><span><strong>'+esc(p.title)+'</strong><small>'+(p.isGap?esc(p.status):esc(p.author)+' · '+p.year+' · '+categoryLabel(p.category)+' · '+esc(p.access))+'</small></span></button>').join('')+'</div>';queueHeight()}
function setScene(key){scene=key;const keep=PAPERS.filter(p=>key==='all'||p.category===key),ids=new Set(keep.map(p=>p.id));let qs=QUESTIONS.filter(q=>key==='all'||q.related.some(id=>ids.has(id)));demoPapers=[...keep,...qs].map(p=>({...p}));const allids=new Set(demoPapers.map(p=>p.id));edges=ALL_EDGES.filter(e=>allids.has(e.from)&&allids.has(e.to));if(key!=='all'){demoPapers.forEach((p,i)=>{let t=-Math.PI/2+i/demoPapers.length*Math.PI*2;p.x=700+430*Math.cos(t);p.y=450+300*Math.sin(t)})}placeLabels();document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key));let s=SCENES[key];document.getElementById('scene-name').textContent=s.name;document.getElementById('scene-description').textContent=s.desc;document.getElementById('graph-status').textContent=keep.length+'项来源 · '+qs.length+'项研究缺口';document.getElementById('paper-detail').hidden=true;setGraphMode(graphMode);queueHeight()}
let heightScheduled=false,lastHeight=0;
function queueHeight(){if(!heightScheduled){heightScheduled=true;requestAnimationFrame(()=>{heightScheduled=false;let h=Math.ceil(document.querySelector('main').getBoundingClientRect().height+32);if(Math.abs(h-lastHeight)>1){lastHeight=h;parent.postMessage({type:'petro-papermap-height',height:h},'*')}})}}
setScene('all');new ResizeObserver(queueHeight).observe(document.querySelector('main'));document.addEventListener('toggle',queueHeight,true);window.addEventListener('load',queueHeight);document.fonts.ready.then(queueHeight);
window.PerforationPaperMap={state:()=>({scene,mode:graphMode,selected,graphView,papers:demoPapers.map(p=>p.id),edges:edges.map(e=>({...e}))})};
</script></html>

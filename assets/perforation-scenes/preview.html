配要求后，才能进一步比较穿深、入口孔径和成本。不同产品的试验条件可能不同，规格表中的高数值未必代表目标井段中的优势，因此候选方案应保留试验条件、产品来源和适配依据。", "reading_lead": "从结构与参数出发，观察其对流动或定位结果的影响，再结合独立观测判断结论的适用范围。", "image": "selection.png", "terms": [["工程输入", "岩性、套管钢级、壁厚与完井方式分别对应适配规则。只有四项均满足，型号才进入评分排序。单独改变壁厚，观察哪个型号失去资格，并打开规则矩阵核对原因。", "若所有型号均被排除，结果应保留空候选集。此时检查输入、规则来源和器材覆盖，比选择一个不合格的高分型号更有意义。"], ["计算方法", "穿深的单位是mm，孔径的单位也是mm，但数值范围不同；成本又是另一个尺度。原程序采用固定效用关系，将三项转换到可比较的范围。", "穿深按L/700，孔径按D/25，成本按1−C/4计算效用。打开分项贡献图，查看每项效用与归一化权重的乘积如何组成总分。"], ["输出与指标", "选中一个型号，依次核对四项适配条件、三项指标与评分贡献。解释应回答为什么进入候选、为什么排在这里，以及它相对其他合格型号牺牲了什么。", "没有已知正确型号标签时，应检查约束满足情况与排序稳定性。分类准确率、召回率等指标不适用于这套规则排序任务。"], ["应用条件", "真实选型需用产品资料、认证试验及现场条件替换教学规则，并记录适用温压、输送方式和器材版本。不同条件下取得的穿深数据应先检查可比性。", "最终方案还需结合施工与后续完井要求核对。当前演示保留原规则库，不随页面偏好修改器材性能。"]], "scenes": [["常规完井器材适配", "selection.png", "左侧输入井况，主图逐型号显示能否通过约束及合格型号的评分。先看通过数量，再看排名。合格候选中的高分表示当前偏好下更靠前。", "本演示保留五个EDU教学型号及既有规则。它们用于解释筛选与排序的区别，型号编号和指标均按原库展示。"], ["大孔径与深穿透取舍", "geometry-structure-v2.png", "保持井况不变，提高穿深偏好，再提高大孔径偏好。观察首选型号和各项贡献是否变化。若排名未变，检查首选是否在相关指标上仍占优势，或者其余型号已被约束排除。", "权重表达设计侧重，不是学习得到的概率。改变权重不会改变型号本身的穿深、孔径或成本，只会改变合格型号之间的比较方式。"], ["压裂与施工条件核对", "network.png", "真实选型需用产品资料、认证试验及现场条件替换教学规则，并记录适用温压、输送方式和器材版本。不同条件下取得的穿深数据应先检查可比性。", "最终方案还需结合施工与后续完井要求核对。当前演示保留原规则库，不随页面偏好修改器材性能。"]], "bridge": "本演示保留五个EDU教学型号及既有规则。它们用于解释筛选与排序的区别，型号编号和指标均按原库展示。", "intro": "本例先按岩性、套管钢级、壁厚和完井方式筛选型号，再在合格型号中比较穿深、入口孔径与相对成本。下图分别说明截面尺寸与两类成孔目标的含义。", "object": "井况给定后，哪些弹型能够使用，合格型号之间怎样进行性能取舍？"}, {"title": "射孔效果智能评估", "key": "evaluation", "question": "措施前后生产指标怎样变化，哪些层段值得进一步复核？", "scope": "射孔后的产量变化同时受到生产压差、含水、井况和作业制度影响。评价措施效果，需要把生产与压力记录按作业时间对齐，并与措施前的基线比较。全井指标反映整体响应；若要判断具体层段的贡献，还需产液剖面、分层测试或其他独立观测。", "reading_lead": "从结构与参数出发，观察其对流动或定位结果的影响，再结合独立观测判断结论的适用范围。", "image": "evaluation.png", "terms": [["工程输入", "缺测会中断计算，尖峰会改变均值。原程序先保留异常位置，再进行插值与局部中位数检查。切换质控情景，对照原始、处理后曲线和修复记录。", "原算法不跨第30天寻找局部修复邻域，以免将措施前后差异抹平。平滑曲线帮助阅读，评分仍使用质控后的日值。"], ["计算方法", "相同产液量可能对应不同生产压差与含水率。原程序由地层压力减井底流压得到压差，再用产液量除以压差并乘油相比例，构造油相指数。", "保持措施效应不变，只调整含水率或压差。先看原始产液，再看油相指数比，理解为什么生产指标需要条件修正。"], ["输出与指标", "六段分数由全井油相指数比和合成PLT相对效率共同形成，并限制在0—100。调节复核阈值，会改变被标记的层段数量，不会改写原始生产记录。", "打开分层评分依据，查看低分来自整体指标还是该段相对效率。阈值提示用于安排检查，分数不等于实际失效概率。"], ["应用条件", "解释结果时，应同步核对生产制度、井底压力、含水、其他措施与井史。前后差异可以描述响应，净措施效应还需要可比对照和更完整的混杂因素控制。", "整理报告时保留质控日志、窗口、指标定义和分层资料来源，使下一位读者能够按同样条件重算。"]], "scenes": [["全井措施前后评价", "evaluation.png", "时间曲线以第30天为措施时点。先比较措施前后的产液、压力和含水，再查看油相指数比及六段评分。主图的灰色轮廓保留初始工况。", "本页90天生产序列及六段PLT均为原有合成记录。全井时间变化与分层信息来自不同输入，不能仅凭一条全井曲线确定每层贡献。"], ["分层贡献与低效段复核", "evaluation.png", "六段分数由全井油相指数比和合成PLT相对效率共同形成，并限制在0—100。调节复核阈值，会改变被标记的层段数量，不会改写原始生产记录。", "打开分层评分依据，查看低分来自整体指标还是该段相对效率。阈值提示用于安排检查，分数不等于实际失效概率。"], ["效果归因与资料补充", "productivity.png", "解释结果时，应同步核对生产制度、井底压力、含水、其他措施与井史。前后差异可以描述响应，净措施效应还需要可比对照和更完整的混杂因素控制。", "整理报告时保留质控日志、窗口、指标定义和分层资料来源，使下一位读者能够按同样条件重算。"]], "bridge": "本页90天生产序列及六段PLT均为原有合成记录。全井时间变化与分层信息来自不同输入，不能仅凭一条全井曲线确定每层贡献。", "intro": "时间曲线以第30天为措施时点。先比较措施前后的产液、压力和含水，再查看油相指数比及六段评分。主图的灰色轮廓保留初始工况。", "object": "措施前后生产指标怎样变化，哪些层段值得进一步复核？"}, {"title": "射孔前候选层段岩性初筛", "key": "lithology", "question": "如何利用测井曲线识别候选岩性区间，为射孔层段研究提供初筛信息？", "scope": "测井响应可用于识别岩性及其沿深度的分布，为射孔前的候选层段筛选提供地质依据。岩性分类本身尚不足以确定射孔位置，还需结合流体解释、含水、隔层、地应力及完井条件。初筛的作用是缩小后续评价范围，并保留分类不确定的层段供进一步核查。", "reading_lead": "从结构与参数出发，观察其对流动或定位结果的影响，再结合独立观测判断结论的适用范围。", "image": "lithology.png", "terms": [["工程输入", "GR反映自然伽马响应，RHOB为体积密度，NPHI为中子孔隙度响应，RDEP为深电阻率，DTC为纵波时差。不同曲线共同约束岩性解释。", "改变当前井和深度，观察实际输入、原标签和模型分数。电阻率取对数后进入模型，标准化参数仅由训练井估计。"], ["计算方法", "原程序使用4800条公开记录，并按井划分训练、验证和测试。验证井用于选择训练轮数，测试井不参与归一化、梯度或选轮。", "相邻深度点相似，若随机混在训练与测试中，容易高估迁移能力。按井留出更接近面对一口新井时的检验。"], ["输出与指标", "阈值决定哪些采样点记为预测阳性，覆盖比例约束决定20 m窗口中阳性点需占多少。调高阈值，查看候选窗口及召回率如何变化。", "测试集中类别不均衡，应同时看精确率、召回率和F1。全部预测为非砂岩类也可能获得较高准确率，因此准确率必须结合类别构成阅读。"], ["应用条件", "候选窗口按当前井20 m分箱、至少三个采样点等原规则形成，按箱内分数排序。它们首先是需要进一步解释的岩性窗口。", "下一步需加入流体、含水、隔层、应力和施工条件。保留原始行号、采样跨度与资料来源，便于工程人员复核。"]], "scenes": [["测井岩性候选初筛", "lithology.png", "当前记录来自真实公开测井数据。GR、密度、中子、电阻率和时差共同作为输入，模型给出砂岩类分数，再按深度汇总候选解释窗口。", "砂岩类在本任务中包含原标签定义的相应类别。高分表示分类模型倾向，不能直接解读为含油概率或射孔成功率。"], ["候选窗口与分类阈值", "lithology.png", "阈值决定哪些采样点记为预测阳性，覆盖比例约束决定20 m窗口中阳性点需占多少。调高阈值，查看候选窗口及召回率如何变化。", "

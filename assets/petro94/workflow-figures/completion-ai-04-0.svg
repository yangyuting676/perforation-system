<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="01 文献取数：先定义输入与目标" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="760" height="420" rx="15" fill="#f5f9f7" stroke="none"/><text x="28" y="42" font-size="22" fill="#173f50" text-anchor="start">01 文献取数：先定义输入与目标</text><rect x="28" y="68" width="704" height="242" rx="9" fill="white" stroke="#d3e2dc"/><rect x="28" y="68" width="704" height="39" rx="9" fill="#e3efea" stroke="none"/><text x="48" y="94" font-size="15" fill="#173f50" text-anchor="start">每条记录保留的字段</text><text x="290" y="94" font-size="15" fill="#173f50" text-anchor="start">单位</text><text x="422" y="94" font-size="15" fill="#173f50" text-anchor="start">为什么需要它</text><text x="48" y="144" font-size="18" fill="#168577" text-anchor="start">压差</text><text x="290" y="144" font-size="15" fill="#173f50" text-anchor="start">MPa</text><text x="422" y="144" font-size="14" fill="#57737c" text-anchor="start">两处压力之差，是流动驱动或密封承</text><path d="M42,166L716,166" fill="none" stroke="#e5ede9" stroke-width="1" /><text x="48" y="209" font-size="18" fill="#168577" text-anchor="start">温度</text><text x="290" y="209" font-size="15" fill="#173f50" text-anchor="start">°C</text><text x="422" y="209" font-size="14" fill="#57737c" text-anchor="start">热条件影响材料、流体和测量响应</text><path d="M42,231L716,231" fill="none" stroke="#e5ede9" stroke-width="1" /><text x="48" y="274" font-size="18" fill="#168577" text-anchor="start">养护时间</text><text x="290" y="274" font-size="15" fill="#173f50" text-anchor="start">h</text><text x="422" y="274" font-size="14" fill="#57737c" text-anchor="start">指定温压下的材料养护时长</text><path d="M380,318L380,334" fill="none" stroke="#168577" stroke-width="2" /><polyline points="385.0,324.0 380,334 375.0,324.0" fill="none" stroke="#168577" stroke-width="2"/><rect x="120" y="337" width="520" height="38" rx="9" fill="#e5f1eb" stroke="none"/><text x="380" y="362" font-size="17" fill="#168577" text-anchor="middle">对齐到目标：密封响应指数（分）</text><text x="28" y="395" font-size="13" fill="#57737c" text-anchor="start">记录结构示意；实际取数还需样本编号、井/批次、条件与来源</text></svg>
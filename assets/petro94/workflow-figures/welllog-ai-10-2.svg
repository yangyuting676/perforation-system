<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="03 分开训练与检验，避免近重复泄漏" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="760" height="420" rx="15" fill="#f5f9f7" stroke="none"/><text x="28" y="42" font-size="22" fill="#173f50" text-anchor="start">03 分开训练与检验，避免近重复泄漏</text><text x="30" y="88" font-size="18" fill="#173f50" text-anchor="start">先按井留出，再进行拟合与构窗</text><text x="34" y="139" font-size="17" fill="#168577" text-anchor="start">训练组</text><rect x="160" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><rect x="218" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><rect x="276" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><rect x="334" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><rect x="392" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><rect x="450" y="116" width="49" height="35" rx="4" fill="#168577" stroke="none"/><text x="530" y="139" font-size="15" fill="#57737c" text-anchor="start">拟合尺度与模型</text><text x="34" y="204" font-size="17" fill="#3b7da2" text-anchor="start">验证组</text><rect x="160" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><rect x="218" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><rect x="276" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><rect x="334" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><rect x="392" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><rect x="450" y="181" width="49" height="35" rx="4" fill="#3b7da2" stroke="none"/><text x="530" y="204" font-size="15" fill="#57737c" text-anchor="start">选择设置与阈值</text><text x="34" y="269" font-size="17" fill="#c58c46" text-anchor="start">独立测试组</text><rect x="160" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><rect x="218" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><rect x="276" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><rect x="334" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><rect x="392" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><rect x="450" y="246" width="49" height="35" rx="4" fill="#c58c46" stroke="none"/><text x="530" y="269" font-size="15" fill="#57737c" text-anchor="start">冻结后评价</text><rect x="30" y="323" width="700" height="49" rx="9" fill="white" stroke="#c8dbce"/><text x="380" y="353" font-size="19" fill="#168577" text-anchor="middle">工程参照 + 独立误差 + 适用条件</text><text x="28" y="395" font-size="13" fill="#57737c" text-anchor="start">文献研究的验证设计归纳；本站合成演示不冒充跨井或现场验证</text></svg>